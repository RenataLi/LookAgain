name: CPU checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight test requirements
        run: |
          python -m pip install "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "pytest>=8,<10" "Pillow>=11" "numpy>=2,<3" "setuptools>=78" "pypdf>=5,<7" "matplotlib>=3.9"
      - name: Run parser, pairing, data and CLI checks
        run: python -m pytest -q
      - name: Reproduce the published results
        run: |
          python -S scripts/verify_release.py
          python -S scripts/reproduce_results.py

# Model inference is measured separately on CUDA; no weights are downloaded by CI.
