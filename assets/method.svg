<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="980" viewBox="0 0 1560 980" role="img" aria-labelledby="title desc">
  <title id="title">LookAgain: a small region ranker with a frozen VLM</title>
  <desc id="desc">A provided page and question produce a 256-visual-token-budget overview. A frozen Qwen3-VL-4B decoder performs one feature forward. Fixed 32-dimensional projections of region and final prompt-token states form 73 features: region32, region-by-query interaction32 and position9. A ridge ranker, fitted on archived exact-match grades using five source-disjoint folds, commits one of nine overlapping windows. A fresh frozen-model request uses the overview plus a 1024-token-budget native crop to answer. A separate full-page 4096-token-budget answer is the high-resolution baseline. The 124 sources are reused development data; this method chooses where to look, not whether to look.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5 0 9" fill="none" stroke="#46657a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="amberArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5 0 9" fill="none" stroke="#ab701c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="mutedArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5 0 9" fill="none" stroke="#8d9ba8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <pattern id="latent" width="15" height="15" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="9" height="9" rx="2" fill="#4da5ac"/></pattern>
  </defs>
  <rect width="1560" height="980" rx="24" fill="#f6f9fc"/>
  <text x="48" y="57" fill="#162e43" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-.7">A small ranker. A frozen visual model.</text>
  <text x="49" y="92" fill="#567083" font-family="Segoe UI, Arial, sans-serif" font-size="20">Choose where to look again, then answer from the overview and one native crop.</text>
  <rect x="48" y="130" width="277" height="36" rx="18" fill="#e3f3f1"/>
  <text x="66" y="154" fill="#1d716d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing=".4">FROZEN Qwen3-VL-4B-Instruct</text>
  <text x="342" y="154" fill="#687c8d" font-family="Segoe UI, Arial, sans-serif" font-size="17">124 reused development sources</text>

  <!-- Labels enter fitting only, never the answer-time observation path. -->
  <rect x="1078" y="120" width="434" height="78" rx="12" fill="#fff3de" stroke="#d7ad6a" stroke-dasharray="5 4"/>
  <text x="1100" y="147" fill="#996218" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.1">TRAINING ONLY · ARCHIVED GRADES</text>
  <text x="1100" y="174" fill="#74582f" font-family="Segoe UI, Arial, sans-serif" font-size="17">9 old exact-match labels per training source</text>
  <path d="M1295 198V223" fill="none" stroke="#ab701c" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#amberArrow)"/>

  <!-- First row: inputs, overview, feature forward, and fixed ranking model. -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="48" y="232" width="250" height="306" rx="16" fill="#fff" stroke="#d5e0e8" stroke-width="1.5"/>
    <circle cx="79" cy="266" r="14" fill="#e8eff5"/><text x="79" y="272" text-anchor="middle" fill="#476276" font-size="14" font-weight="700">1</text>
    <text x="104" y="273" fill="#193348" font-size="22" font-weight="650">Page + question</text>
    <rect x="78" y="305" width="102" height="126" rx="7" fill="#eff4f8" stroke="#98b0c1"/>
    <rect x="91" y="322" width="41" height="5" rx="2.5" fill="#58798d"/>
    <path d="M91 345H163M91 358H156M91 371H163M91 393H153M91 406H163" stroke="#a3bac9" stroke-width="4" stroke-linecap="round"/>
    <rect x="158" y="374" width="111" height="55" rx="10" fill="#e6f4f3" stroke="#8ac5c0"/>
    <text x="179" y="410" fill="#237872" font-size="29" font-weight="700">Q ?</text>
    <text x="70" y="474" fill="#587183" font-size="18">Provided page</text>
    <text x="70" y="501" fill="#587183" font-size="18">Question-conditioned input</text>

    <path d="M303 384H329" fill="none" stroke="#46657a" stroke-width="2.2" marker-end="url(#arrow)"/>

    <rect x="338" y="232" width="250" height="306" rx="16" fill="#fff" stroke="#d5e0e8" stroke-width="1.5"/>
    <circle cx="369" cy="266" r="14" fill="#e8eff5"/><text x="369" y="272" text-anchor="middle" fill="#476276" font-size="14" font-weight="700">2</text>
    <text x="394" y="273" fill="#193348" font-size="22" font-weight="650">Overview</text>
    <rect x="405" y="303" width="115" height="142" rx="8" fill="#eaf5f4" stroke="#75adae"/>
    <path d="M417 326H501M417 342H501M417 358H483M417 382H501M417 398H487M417 414H501" stroke="#9dc4c4" stroke-width="6" stroke-linecap="round"/>
    <rect x="357" y="465" width="212" height="43" rx="9" fill="#e3f3f1"/>
    <text x="463" y="493" text-anchor="middle" fill="#1c756f" font-size="20" font-weight="650">256-token budget</text>

    <path d="M593 384H619" fill="none" stroke="#46657a" stroke-width="2.2" marker-end="url(#arrow)"/>

    <rect x="628" y="232" width="410" height="306" rx="16" fill="#eef8f8" stroke="#8ebfbe" stroke-width="1.5"/>
    <circle cx="659" cy="266" r="14" fill="#d3eeeb"/><text x="659" y="272" text-anchor="middle" fill="#237970" font-size="14" font-weight="700">3</text>
    <text x="684" y="273" fill="#193348" font-size="22" font-weight="650">Frozen feature extraction</text>
    <text x="651" y="313" fill="#397e80" font-size="20" font-weight="600">Qwen3-VL-4B · one forward</text>
    <rect x="652" y="337" width="77" height="79" rx="8" fill="url(#latent)"/>
    <path d="M741 359H779M741 389H779" stroke="#7da9ab" stroke-width="2"/>
    <rect x="791" y="343" width="219" height="31" rx="6" fill="#dbefee"/>
    <text x="802" y="365" fill="#30696d" font-size="16">9 pooled region states</text>
    <rect x="791" y="382" width="219" height="40" rx="6" fill="#dbefee"/>
    <text x="802" y="407" fill="#30696d" font-size="16">Final prompt-token state</text>
    <text x="651" y="468" fill="#587183" font-size="18">Fixed projection: 2560 → 32</text>
    <text x="651" y="497" fill="#587183" font-size="17">Prompt state includes image + question.</text>

    <path d="M1043 384H1069" fill="none" stroke="#46657a" stroke-width="2.2" marker-end="url(#arrow)"/>

    <rect x="1078" y="232" width="434" height="306" rx="16" fill="#fff" stroke="#9fc3c7" stroke-width="1.5"/>
    <circle cx="1109" cy="266" r="14" fill="#d3eeeb"/><text x="1109" y="272" text-anchor="middle" fill="#237970" font-size="14" font-weight="700">4</text>
    <text x="1134" y="273" fill="#193348" font-size="22" font-weight="650">Ridge region ranker</text>
    <text x="1100" y="315" fill="#1f7674" font-size="21" font-weight="600">73 features → one score per region</text>
    <rect x="1100" y="341" width="110" height="58" rx="9" fill="#e4f1f4"/>
    <text x="1155" y="365" text-anchor="middle" fill="#376b7b" font-size="16">region</text><text x="1155" y="387" text-anchor="middle" fill="#376b7b" font-size="19" font-weight="650">32</text>
    <text x="1221" y="379" fill="#8494a0" font-size="20">+</text>
    <rect x="1245" y="341" width="118" height="58" rx="9" fill="#dcf1ed"/>
    <text x="1304" y="365" text-anchor="middle" fill="#2b766e" font-size="16">region × query</text><text x="1304" y="387" text-anchor="middle" fill="#2b766e" font-size="19" font-weight="650">32</text>
    <text x="1374" y="379" fill="#8494a0" font-size="20">+</text>
    <rect x="1398" y="341" width="91" height="58" rx="9" fill="#f5eddf"/>
    <text x="1443" y="365" text-anchor="middle" fill="#8d6c39" font-size="16">position</text><text x="1443" y="387" text-anchor="middle" fill="#8d6c39" font-size="19" font-weight="650">9</text>
    <text x="1100" y="445" fill="#4e6578" font-size="18">5 source-disjoint folds · ridge α = 1</text>
    <text x="1100" y="476" fill="#4e6578" font-size="18">Only training-fold old grades fit the scorer.</text>
    <text x="1100" y="506" fill="#758593" font-size="16">A lightweight learned selection layer</text>

    <!-- The chosen window is committed before new answer generation. -->
    <path d="M1295 544V619" fill="none" stroke="#46657a" stroke-width="2.2" marker-end="url(#arrow)"/>
    <rect x="1078" y="632" width="434" height="220" rx="16" fill="#fff" stroke="#9fc3c7" stroke-width="1.5"/>
    <circle cx="1109" cy="666" r="14" fill="#d3eeeb"/><text x="1109" y="672" text-anchor="middle" fill="#237970" font-size="14" font-weight="700">5</text>
    <text x="1134" y="673" fill="#193348" font-size="22" font-weight="650">Choose one of nine windows</text>
    <rect x="1102" y="705" width="124" height="124" rx="8" fill="#eff4f7" stroke="#c4d2dc"/>
    <g fill="none" stroke="#93b8bf" stroke-width="1.2">
      <rect x="1111" y="714" width="53" height="53"/><rect x="1137" y="714" width="53" height="53"/><rect x="1163" y="714" width="53" height="53"/>
      <rect x="1111" y="740" width="53" height="53"/><rect x="1137" y="740" width="53" height="53"/><rect x="1163" y="740" width="53" height="53"/>
      <rect x="1111" y="766" width="53" height="53"/><rect x="1137" y="766" width="53" height="53"/><rect x="1163" y="766" width="53" height="53"/>
    </g>
    <rect x="1163" y="714" width="53" height="53" rx="2" fill="#51bdaf" fill-opacity=".3" stroke="#228b7e" stroke-width="2.5"/>
    <text x="1247" y="731" fill="#587183" font-size="18">Fixed overlapping candidates</text>
    <text x="1247" y="764" fill="#1f7674" font-size="20" font-weight="600">Commit the region ID</text>
    <text x="1247" y="796" fill="#587183" font-size="17">before new answers</text>

    <path d="M1072 742H1047" fill="none" stroke="#46657a" stroke-width="2.2" marker-end="url(#arrow)"/>
    <rect x="628" y="632" width="410" height="220" rx="16" fill="#eef8f8" stroke="#8ebfbe" stroke-width="1.5"/>
    <circle cx="659" cy="666" r="14" fill="#d3eeeb"/><text x="659" y="672" text-anchor="middle" fill="#237970" font-size="14" font-weight="700">6</text>
    <text x="684" y="673" fill="#193348" font-size="22" font-weight="650">Overview + native crop</text>
    <rect x="652" y="711" width="41" height="51" rx="4" fill="#d9ebed" stroke="#76a7ac"/>
    <path d="M660 724H685M660 735H681M660 746H685" stroke="#93b6c0" stroke-width="2.5"/>
    <text x="709" y="746" fill="#759098" font-size="24">+</text>
    <rect x="738" y="711" width="68" height="51" rx="4" fill="#c7e8e1" stroke="#43998d"/>
    <path d="M748 725H795M748 736H786M748 747H795" stroke="#4fa295" stroke-width="4"/>
    <text x="824" y="729" fill="#397e80" font-size="16">Fresh request</text>
    <text x="824" y="754" fill="#397e80" font-size="16">Frozen VLM</text>
    <text x="651" y="801" fill="#1f7674" font-size="20" font-weight="600">256 + 1,024 visual-token budgets</text>
    <text x="651" y="830" fill="#587183" font-size="17">The crop comes from the source page.</text>

    <path d="M622 742H597" fill="none" stroke="#46657a" stroke-width="2.2" marker-end="url(#arrow)"/>
    <rect x="338" y="632" width="250" height="220" rx="16" fill="#163247"/>
    <circle cx="369" cy="666" r="14" fill="#305365"/><text x="369" y="672" text-anchor="middle" fill="#b5e8df" font-size="14" font-weight="700">7</text>
    <text x="394" y="673" fill="#edf7fc" font-size="22" font-weight="650">Answer</text>
    <rect x="360" y="710" width="207" height="48" rx="8" fill="#24485b"/>
    <text x="375" y="741" fill="#8be0d1" font-family="Consolas, monospace" font-size="19">ANSWER: …</text>
    <text x="360" y="797" fill="#c0d5e0" font-size="18">Short extractive span</text>
    <text x="360" y="829" fill="#8cb0c0" font-size="16">Record quality and compute</text>

    <!-- Independent baseline from the same given source page and question. -->
    <path d="M173 544V619" fill="none" stroke="#8d9ba8" stroke-width="2" marker-end="url(#mutedArrow)"/>
    <text x="187" y="585" fill="#8999a7" font-size="14">same page + question</text>
    <rect x="48" y="632" width="250" height="220" rx="16" fill="#eff3f7" stroke="#b5c3cf" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="69" y="670" fill="#617888" font-size="14" font-weight="700" letter-spacing="1.1">SEPARATE BASELINE</text>
    <text x="69" y="710" fill="#384f64" font-size="25" font-weight="650">High-resolution</text>
    <text x="69" y="740" fill="#384f64" font-size="25" font-weight="650">full-page answer</text>
    <text x="69" y="790" fill="#5c7385" font-size="20" font-weight="600">4,096-token budget</text>
    <text x="69" y="822" fill="#758795" font-size="17">Full-page reference</text>

    <path d="M48 891H1512" stroke="#dbe4eb"/>
    <text x="48" y="925" fill="#536c7f" font-size="17">All token counts shown are visual-token budgets; actual input size and compute are measured.</text>
    <text x="48" y="952" fill="#728494" font-size="16">Development workflow · Reused development data · five-fold out-of-fold prediction</text>
  </g>
</svg>
